  }
  nav button:hover{ color:var(--text); border-color:var(--accent);}
  nav button.active{ background:linear-gradient(135deg,var(--accent),#7aa8ff); color:#fff; border-color:transparent; font-weight:600; box-shadow:0 4px 14px rgba(79,140,255,.35);}
  main{padding:26px 32px 60px; max-width:1400px; margin:0 auto;}
  .company-detail{max-width:1080px; margin:0 auto;}
  .pie-wrap{max-width:500px; margin:0 auto;}
  .down-grid{display:grid; grid-template-columns:1fr 1.4fr; gap:18px; align-items:stretch;}
  .note-card{display:flex; flex-direction:column; justify-content:center; border-color:#4f8cff55;}
  .note-body{font-size:14px; line-height:1.9; color:#e8edfa;}  .note-sub{margin-top:10px; font-size:12.5px; color:#9aa7c7;}
  .tab-panel{display:none; animation:fadeIn .25s ease;}
  .tab-panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .section-title{
    font-size:18px; font-weight:700; margin:32px 0 14px; padding-left:10px;
    border-left:4px solid var(--accent); display:flex; align-items:center; gap:8px;
  }
  .section-title:first-child{margin-top:0;}
  .section-sub{color:var(--sub); font-size:12.5px; margin:-8px 0 16px 14px;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:8px;}
  .kpi-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    position:relative; overflow:hidden;
  }
  .kpi-card .label{color:var(--sub); font-size:12px; margin-bottom:6px;}
  .kpi-card .value{font-size:22px; font-weight:700; letter-spacing:0.3px;}
  .kpi-card .delta{font-size:12.5px; margin-top:6px; display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px;}
  .kpi-note{font-size:11.5px; color:#ffb648; margin-top:8px; line-height:1.5;}
  .delta.up{color:#0d3a24; background:var(--good);}
  .delta.down{color:#4a1414; background:var(--bad);}
  .delta.flat{color:#3a3010; background:var(--warn);}

  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:18px;}
  .grid-2.staff-grid{grid-template-columns:1fr 1.4fr;}
  .grid-2.qa-grid{grid-template-columns:1fr 1.6fr;}
  .qa-grid .card{display:flex; flex-direction:column;}
  .qa-grid .card ul, .qa-grid .card .qa:last-child{margin-bottom:0;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media (max-width:1000px){ .grid-2, .grid-3{grid-template-columns:1fr;} }

  .card{
  background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px 20px;
    margin-bottom:18px;
  }
  .card h3{margin:0 0 4px; font-size:15px;}
  .card .hint{color:var(--sub); font-size:12px; margin-bottom:10px;}
  .chart-wrap{position:relative; height:300px;}
  .chart-wrap.tall{height:340px;}
  .chart-wrap.short{height:230px;}

  ul.bullets{margin:0; padding-left:0; list-style:none;}
  ul.bullets li{
    position:relative; padding:8px 0 8px 20px; border-bottom:1px dashed var(--border); font-size:13.5px; line-height:1.65; color:#dbe1f2;
  }
  ul.bullets li:last-child{border-bottom:none;}
  ul.bullets li::before{content:"▸"; position:absolute; left:0; top:8px; color:var(--accent2); font-weight:700;}
  ul.bullets.compact li{padding:6px 0 6px 18px; font-size:13px;}

  .qa{border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:var(--panel2);}
  .qa .q{color:var(--accent2); font-weight:600; font-size:13px; margin-bottom:5px;}
  .qa .a{font-size:13px; line-height:1.6; color:#d7ddef;}

  .tag{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; margin-right:6px; margin-bottom:6px; border:1px solid var(--border); color:var(--sub);}
  .tag.hot{color:#fff; background:linear-gradient(135deg,var(--c4),#ff9d6b); border:none;}
  .tag.good{color:#08331c; background:var(--good); border:none;}
  .tag.info{color:#0a2540; background:var(--c2); border:none;}

  table.mini{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.mini th, table.mini td{padding:7px 10px; text-align:right; border-bottom:1px solid var(--border);}
  table.mini th:first-child, table.mini td:first-child{text-align:left;}
  table.mini th{color:var(--sub); font-weight:600;}
  table.mini td.neg{color:var(--bad);}
  table.mini td.pos{color:var(--good);}

  .badge-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .footnote{color:var(--sub); font-size:12px; margin-top:26px; line-height:1.8; border-top:1px solid var(--border); padding-top:16px;}
  .company-hero{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .company-hero h2{margin:0; font-size:24px;}
  .company-hero .code{color:var(--sub); font-size:13px; font-family:Consolas,monospace;}

function yoy(a,b){ return ((a-b)/Math.abs(b)*100); }
function fmtPct(v,digits=1){ return (v>0?"+":"") + v.toFixed(digits) + "%"; }
function fmtWan(v){ return (v/10000).toFixed(2) + "亿"; }

function applyMeta(meta){
  if(!meta) return;
  if(meta.title) document.title = meta.title;
  const h1 = document.querySelector("header h1");
  if(h1 && meta.title){
    // keep emoji prefix if present
    h1.textContent = "📊 " + meta.title.replace(/^📊\s*/, "");
  }
  const sub = document.getElementById("headerSubtitle");
  if(sub){
    const bits = [];
    if(meta.sourceNote) bits.push(meta.sourceNote);
    if(meta.periodLabel) bits.push(meta.periodLabel);
    if(meta.currencyNote) bits.push(meta.currencyNote);
    if(meta.updatedAt) bits.push("更新于 " + meta.updatedAt);
    sub.textContent = bits.join("  |  ");
  }
}

function buildTabs(){
  const TABS = [{key:"overview", label:"📈 总体分析"}].concat(
    COMPANY_ORDER.map(n=>({key:n, label:n}))
  );
  const nav = document.getElementById("tabNav");
  const content = document.getElementById("tabContent");
  nav.innerHTML = "";
  content.innerHTML = "";
  TABS.forEach((t,i)=>{
    const btn = document.createElement("button");
    btn.textContent = t.label;
    btn.dataset.key = t.key;
    if(i===0) btn.classList.add("active");
    btn.addEventListener("click", ()=>switchTab(t.key));
    nav.appendChild(btn);

    const panel = document.createElement("div");
    panel.className = "tab-panel" + (i===0 ? " active" : "");
    panel.id = "panel-" + t.key;
    content.appendChild(panel);
  });
}

async function loadDataAndRender(){
  const sub = document.getElementById("headerSubtitle");
  try{
    let data;
    if (window.__DASH_DATA__) {
      data = window.__DASH_DATA__;
    } else {
      const resp = await fetch("/data/latest.json", {cache:"no-store"});
      if(!resp.ok) throw new Error("HTTP " + resp.status);
      data = await resp.json();
    }
    ALL_COMPANIES = data.companies || [];
    STAFF = data.staff || [];
    BALANCE = data.balance || [];
    CASH_TABLE = data.cash || [];
    FOCUS_NAMES = data.focusNames || [];

    DETAIL = data.detail || {};
    OVERSEAS_HTML = data.overseasHtml || "";
    COMPANY_ORDER = data.companyOrder || [];
    applyMeta(data.meta || {});
    buildTabs();
    switchTab("overview");
  }catch(err){
    console.error(err);
    if(sub) sub.textContent = "数据加载失败：" + err.message + "（请确认 server.py 已启动且 /data/latest.json 可访问）";
  }
}

// 柱顶绝对值标签：Y轴从0开始时仍能直接读出数值
const BAR_DL = {
  display:true, anchor:"end", align:"top",
  color:"#dbe1f2", font:{ size:10.5, weight:"600" },
  formatter:(v)=> v==null ? "" : (Math.abs(v)>=10000 ? (v/10000).toFixed(2)+"亿" : v.toLocaleString(undefined,{maximumFractionDigits:1})),
};

function baseBarOptions(unit, rotate, showLegend){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{ display: !!showLegend, position:"top", labels:{ color:"#cfd7ee", font:{size:11.5}, boxWidth:14 } },
      tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+": "+ctx.parsed.y.toLocaleString(undefined,{maximumFractionDigits:1})+unit } }
    },
    scales:{
      x:{ ticks:{ color:"#9aa7c7", font:{size:11}, maxRotation: rotate?55:0, minRotation: rotate?35:0 }, grid:{ color:"rgba(255,255,255,0.04)" } },
      y:{ ticks:{ color:"#9aa7c7", font:{size:11} }, grid:{ color:"rgba(255,255,255,0.06)" } }
    }
  };
}

        <div class="card">
          <h3>${d.segMixIsPercent ? "下游/产品结构占比" : "分产品线营收（万元）"}</h3>
          ${d.segHint ? `<div class="hint">${d.segHint}</div>` : (d.segMix.some(s=>s.note) ? `<div class="hint">${d.segMix.filter(s=>s.note).map(s=>s.label+"："+s.note).join("；")}</div>` : "")}
          <div class="chart-wrap short pie-wrap"><canvas id="c_seg_${name}"></canvas></div>
        </div>
        <div class="card">
          <h3>下游市场分布（2026H1，%）</h3>
          <div class="chart-wrap short pie-wrap"><canvas id="c_down_${name}"></canvas></div>
        </div>
      </div>` + (d.segMix2Note || d.segMix2Hint ? `
      <div class="card note-card">
          <h3>📝 下游市场备注</h3>
          <div class="note-body">${d.segMix2Note || d.segMix2Hint || ""}</div>
          ${(d.segMix2Note && d.segMix2Hint) ? `<div class="note-sub">${d.segMix2Hint}</div>` : ""}
      </div>` : "") : `
 <div class="grid-3">
        <div class="card">
    <h3>营收对比</h3>
          <div class="chart-wrap short"><canvas id="c_rev_${name}"></canvas></div>
        </div>
 <div class="card">
          <h3>毛利率 / 净利率对比</h3>
    <div class="chart-wrap short"><canvas id="c_margin_${name}"></canvas></div>
    </div>
    <div class="card">
<h3>${d.segMixIsPercent ? "下游/产品结构占比" : "分产品线营收（万元）"}</h3>
          ${d.segMix.some(s=>s.note) ? `<div class="hint">${d.segMix.filter(s=>s.note).map(s=>s.label+"："+s.note).join("；")}</div>` : ""}
          <div class="chart-wrap short"><canvas id="c_seg_${name}"></canvas></div>
  </div>
      </div>`) + (bal ? `
      <div class="grid-2">
        <div class="card">
          <h3>存货净额对比（万元）</h3>
          <div class="chart-wrap short"><canvas id="c_inv_${name}"></canvas></div>
        </div>
        <div class="card">
          <h3>资产减值损失对比（万元）</h3>
          <div class="chart-wrap short"><canvas id="c_imp_${name}"></canvas></div>
        </div>
      </div>` : "");
  } else {
    chartsHtml = `
      <div class="card">
        <h3>下游应用结构占比（2026H1，%）</h3>
     <div class="chart-wrap tall"><canvas id="c_seg_${name}"></canvas></div>
      </div>`;
  }

  panel.innerHTML = `
    <div class="company-detail">
    <div class="company-hero">
      <h2 style="color:${color}">${name}</h2>
      <span class="code">${d.code}</span>
    </div>
    <div class="badge-row">${d.tags.map(t=>`<span class="tag ${t.includes('承压')||t.includes('下滑')||t.includes('不及预期')?'hot':'good'}">${t}</span>`).join("")}</div>

    ${kpiHtml}
    ${chartsHtml}

    <div class="grid-2 qa-grid">
      <div class="card">
        <h3>📌 经营与业绩要点</h3>
        <ul class="bullets">${d.highlights.map(h=>`<li>${h}</li>`).join("")}</ul>
      </div>
      <div class="card">
    <h3>💬 半年度交流 Q&amp;A 精选</h3>
        ${d.qa.map(item=>`<div class="qa"><div class="q">Q：${item.q}</div><div class="a">A：${item.a}</div></div>`).join("")}
      </div>
    </div>
    </div>
  `;

  if(!d.noFin){
    const f = d.fin;
    chartInstances["rev_"+name] = new Chart(document.getElementById("c_rev_"+name), {
      type:"bar",
      data:{ labels:["2025H1","2026H1"], datasets:[{ label:"营业总收入(万元)", data:[f.rev25, f.rev26],
        backgroundColor:["#3a4562", color], borderRadius:8 }]},
  options: (()=>{ const o2=baseBarOptions("万元", false); o2.plugins.datalabels=BAR_DL; return o2; })()
    });

    chartInstances["margin_"+name] = new Chart(document.getElementById("c_margin_"+name), {
   type:"bar",
      data:{ labels:["毛利率","净利率"],
   datasets:[
      {label:"2025H1", data:[f.gm25, (f.np25/f.rev25*100)], backgroundColor:"#3a4562", borderRadius:8},
     {label:"2026H1", data:[f.gm26, (f.np26/f.rev26*100)], backgroundColor:color, borderRadius:8},
        ]},
      options: (()=>{ const o2=baseBarOptions("%", false, true); o2.plugins.datalabels={ ...BAR_DL, formatter:(v)=>v.toFixed(1)+"%" }; return o2; })()
    });

    if(bal){
      chartInstances["inv_"+name] = new Chart(document.getElementById("c_inv_"+name), {
        type:"bar",
        data:{ labels:["2025H1","2026H1"], datasets:[{ label:"存货净额(万元)", data:[bal.inv25, bal.inv26],
          backgroundColor:["#3a4562", color], borderRadius:8 }]},
        options: (()=>{ const o2=baseBarOptions("万元", false); o2.plugins.datalabels=BAR_DL; return o2; })()
      });
      chartInstances["imp_"+name] = new Chart(document.getElementById("c_imp_"+name), {
        type:"bar",
        data:{ labels:["2025H1","2026H1"], datasets:[{ label:"资产减值损失(万元)", data:[bal.imp25, bal.imp26],
          backgroundColor:["#3a4562", color], borderRadius:8 }]},
        options: (()=>{ const o2=baseBarOptions("万元", false); o2.plugins.datalabels={ ...BAR_DL, align:"bottom" }; return o2; })()
      });
    }
  }

  // 结构图（饼图或条形）
  if(d.segMixIsPercent){
    chartInstances["seg_"+name] = new Chart(document.getElementById("c_seg_"+name), {
      type:"doughnut",
      data:{ labels: d.segMix.map(s=>s.label + (s.growth? " ("+s.growth+")" : "")),
        datasets:[{ data: d.segMix.map(s=>s.value),
          backgroundColor:[COLORS.c1,COLORS.c2,COLORS.c3,COLORS.c4,COLORS.c5,COLORS.c6,COLORS.c7,"#7d8bb0"],
     borderColor:"#161d2e", borderWidth:2 }]},
      options:{ plugins:{ legend:{ position: d.segMix2?"right":"bottom", labels:{color:"#cfd7ee", font:{size:10.5}, boxWidth:12} }, datalabels:SEG_LABEL_OPTS }, cutout:"50%", ...(d.segMix2 ? { radius:64 } : {}) }
    });
  } else {
    chartInstances["seg_"+name] = new Chart(document.getElementById("c_seg_"+name), {
      type:"pie",
      data:{ labels: d.segMix.map(s=> s.label + (s.growth? "（"+(s.value>=10000?(s.value/10000).toFixed(2)+"亿":s.value.toLocaleString()+"万")+"，"+s.growth+"）" : "")),
        datasets:[{ label:"营收(万元)", data: d.segMix.map(s=>s.value), rawLabels: d.segMix,
          backgroundColor:[COLORS.c1,COLORS.c2,COLORS.c3,COLORS.c4,COLORS.c5,COLORS.c6,COLORS.c7,"#7d8bb0"],
          borderColor:"#161d2e", borderWidth:2 }]},
      options:{ plugins:{ legend:{ position: d.segMix2?"right":"bottom", labels:{color:"#cfd7ee", font:{size:10.5}, boxWidth:12} },
        tooltip:{ callbacks:{
          title:(items)=>{ const raw = items[0].dataset.rawLabels[items[0].dataIndex]; return raw.label + (raw.growth? "（"+raw.growth+"）" : ""); },
          label:(ctx)=>{
            const raw = ctx.dataset.rawLabels ? ctx.dataset.rawLabels[ctx.dataIndex] : null;
            const lines = ["营收 "+ctx.parsed.toLocaleString()+" 万元（"+(ctx.parsed/ctx.dataset.data.reduce((a,b)=>a+b,0)*100).toFixed(1)+"%）"];
            if(raw && raw.gm) lines.push("毛利率 "+raw.gm);
            if(raw && raw.note) lines.push("备注："+raw.note);
            return lines;
          } } },
        datalabels:SEG_LABEL_OPTS } }
    });
  }

  // 下游市场分布扇形图（可选）
  if(d.segMix2){
    chartInstances["down_"+name] = new Chart(document.getElementById("c_down_"+name), {
      type:"pie",
      data:{ labels: d.segMix2.map(s=>s.label + (s.growth? "（"+s.growth+"）" : "")),
        datasets:[{ data: d.segMix2.map(s=>s.value),
          backgroundColor:[COLORS.c1,COLORS.c3,COLORS.c4,COLORS.c6],
          borderColor:"#161d2e", borderWidth:2 }]},
      options:{ plugins:{ legend:{ position:"right", labels:{color:"#cfd7ee", font:{size:10.5}, boxWidth:12} },
        datalabels:{ ...SEG_LABEL_OPTS } }, radius:64 }
    });
  }
}



loadDataAndRender();
</script>
</body>
